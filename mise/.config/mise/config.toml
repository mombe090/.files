"aqua:kubecolor/kubecolor" = "0.6.0"
"aqua:helm/helm" = "3.21.3"
"aqua:derailed/k9s" = "0.51.0"
"aqua:kubernetes-sigs/kind" = "0.32.0"

# Infrastructure as Code
