# Mise Configuration for Dotfiles
# Documentation: https://mise.jdx.dev/configuration.html

[settings]
experimental = true
verbose = false
yes = false

# configure `mise install` to always keep the downloaded archive
always_keep_download = false        # deleted after install by default
always_keep_install = false         # deleted on failure by default

env_file = '.env'

trusted_config_paths = [
    '~/.config/mise',
]

# ===== LANGUAGE RUNTIMES =====
[tools]
# Node.js ecosystem
"node" = "lts"
"bun" = "1.3.14"

# Python
"python" = "3.14.6"

# Go
"go" = "1.26.5"

# Rust
"rust" = "1.97.1"

# Ruby
"ruby" = "4.0.6"
"eza" = "0.23.5"
"cargo:fd-find" = "10.4.2"
"pipx:pre-commit" = "4.6.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"asdf:asdf-community/asdf-direnv" = "2.37.1"

# Terminal multiplexers
"github:tmux/tmux-builds" = "3.7a"

# System tools
"asdf:mise-plugins/asdf-jq" = "1.8.2"
"yamllint" = "1.38.0"

# ===== DEVOPS & CLOUD TOOLS =====
